<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran Premium SiCerMat</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 20px; background-color: #f8fafc; color: #0f172a; }
        h2 { margin-bottom: 10px; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        img { max-width: 100%; height: auto; margin: 20px 0; border: 1px solid #e2e8f0; border-radius: 8px; }
        p { font-size: 14px; color: #475569; line-height: 1.5; }

<body>
    <div class="container">
        <h2>💳 Pembayaran Premium</h2>

        <!-- GANTI 'qris.png' DENGAN NAMA FILE QRIS ANDA -->
        <img src="qris.png" alt="QRIS SiCerMat">
        
        <p><strong>Nominal:</strong> Rp 50.000 (Sekali Bayar)<br>

        <a href="https://25-design.github.io/Est-Project-Version5/" class="btn-close">Kembali ke Aplikasi</a>
