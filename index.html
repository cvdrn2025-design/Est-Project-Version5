<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SiCerMat - Estimasi RAB & Analisa Harga Satuan</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f8f9fa; }
    .card { border: none; border-radius: 10px; }
    .table-responsive { overflow-x: auto; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-calculator me-2"></i>SiCerMat Pro</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" href="#" data-bs-toggle="modal" data-bs-target="#ahsModal">
              <i class="fa-solid fa-book me-1"></i> Library AHS
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content Container -->
  <div class="container my-4">
    
    <!-- Bagian RAB Utama -->
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0"><i class="fa-solid fa-file-invoice-dollar me-2"></i>Rencana Anggaran Biaya (RAB)</h5>
        <button class="btn btn-light btn-sm text-primary fw-bold" onclick="addRowRAB()">
          <i class="fa-solid fa-plus me-1"></i> Tambah Item
        </button>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-bordered table-striped align-middle" id="rabTable">
            <thead class="table-light text-center">
              <tr>
                <th style="width: 50px;">No</th>
                <th>Uraian Pekerjaan / AHS</th>
                <th style="width: 90px;">Volume</th>
                <th style="width: 80px;">Satuan</th>
                <th style="width: 140px;">Harga Satuan</th>
                <th style="width: 160px;">Total Harga</th>
                <th style="width: 60px;"><i class="fa-solid fa-gear"></i></th>
              </tr>
            </thead>
            <tbody id="rabTableBody">
              <!-- Baris RAB akan di-generate secara dinamis oleh skrip utama -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- PANEL HARGA DASAR (Editable & Tanpa Rp Statis) -->
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-secondary text-white">
        <h5 class="mb-0"><i class="fa-solid fa-tags me-2"></i>Panel Harga Dasar</h5>
      </div>
      <div class="card-body">
        
        <!-- Accordion Komponen -->
        <div class="accordion" id="hargaDasarAccordion">
          
          <!-- Bahan -->
          <div class="accordion-item mb-2 border">
            <h2 class="accordion-header" id="headingBahan">
              <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseBahan">
                <i class="fa-solid fa-cubes me-2 text-primary"></i> Lihat Komponen Bahan
              </button>
            </h2>
            <div id="collapseBahan" class="accordion-collapse collapse show" data-bs-parent="#hargaDasarAccordion">
              <div class="accordion-body bg-white">
                <div class="row mb-3 g-2">
                  <div class="col-md-8">
                    <input type="text" id="searchBahan" class="form-control form-control-sm" placeholder="Cari bahan..." onkeyup="renderPriceTable('bahan')">
                  </div>
                  <div class="col-md-4 text-end">
                    <button class="btn btn-success btn-sm w-100" onclick="addMasterItem('bahan')">
                      <i class="fa-solid fa-plus me-1"></i> Tambah Bahan
                    </button>
                  </div>
                </div>
                <div class="table-responsive">
                  <table class="table table-sm table-hover align-middle mb-0">
                    <thead class="table-light">
                      <tr>
                        <th>Nama Material</th>
                        <th class="text-end" style="width: 180px;">Harga Satuan</th>
                      </tr>
                    </thead>
                    <tbody id="materialPriceTable">
                      <!-- Render dari master-data.js -->
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>

          <!-- Alat -->
          <div class="accordion-item mb-2 border">
            <h2 class="accordion-header" id="headingAlat">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseAlat">
                <i class="fa-solid fa-truck-pickup me-2 text-warning"></i> Lihat Komponen Alat
              </button>
            </h2>
            <div id="collapseAlat" class="accordion-collapse collapse" data-bs-parent="#hargaDasarAccordion">
              <div class="accordion-body bg-white">
                <div class="row mb-3 g-2">
                  <div class="col-md-8">
                    <input type="text" id="searchAlat" class="form-control form-control-sm" placeholder="Cari alat..." onkeyup="renderPriceTable('alat')">
                  </div>
                  <div class="col-md-4 text-end">
                    <button class="btn btn-success btn-sm w-100" onclick="addMasterItem('alat')">
                      <i class="fa-solid fa-plus me-1"></i> Tambah Alat
                    </button>
                  </div>
                </div>
                <div class="table-responsive">
                  <table class="table table-sm table-hover align-middle mb-0">
                    <thead class="table-light">
                      <tr>
                        <th>Nama Alat</th>
                        <th class="text-end" style="width: 180px;">Harga Satuan</th>
                      </tr>
                    </thead>
                    <tbody id="equipmentPriceTable">
                      <!-- Render dari master-data.js -->
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>

          <!-- Upah -->
          <div class="accordion-item border">
            <h2 class="accordion-header" id="headingUpah">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseUpah">
                <i class="fa-solid fa-users me-2 text-success"></i> Lihat Komponen Upah
              </button>
            </h2>
            <div id="collapseUpah" class="accordion-collapse collapse" data-bs-parent="#hargaDasarAccordion">
              <div class="accordion-body bg-white">
                <div class="row mb-3 g-2">
                  <div class="col-md-8">
                    <input type="text" id="searchUpah" class="form-control form-control-sm" placeholder="Cari upah..." onkeyup="renderPriceTable('upah')">
                  </div>
                  <div class="col-md-4 text-end">
                    <button class="btn btn-success btn-sm w-100" onclick="addMasterItem('upah')">
                      <i class="fa-solid fa-plus me-1"></i> Tambah Upah
                    </button>
                  </div>
                </div>
                <div class="table-responsive">
                  <table class="table table-sm table-hover align-middle mb-0">
                    <thead class="table-light">
                      <tr>
                        <th>Jenis Tenaga Kerja</th>
                        <th class="text-end" style="width: 180px;">Harga Satuan</th>
                      </tr>
                    </thead>
                    <tbody id="laborPriceTable">
                      <!-- Render dari master-data.js -->
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>

  </div>

  <!-- Modal Library AHS (Dengan Kolom Koefisien Editable) -->
  <div class="modal fade" id="ahsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header bg-dark text-white">
          <h5 class="modal-title"><i class="fa-solid fa-book-open me-2"></i>Library AHS (Analisa Harga Satuan)</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body bg-light">
          <!-- Filter & Pencarian AHS -->
          <div class="row g-2 mb-3">
            <div class="col-md-5">
              <select id="filterKategoriAhs" class="form-select form-select-sm" onchange="renderAhsLibrary()">
                <option value="Semua">Semua Kategori</option>
                <option value="Pekerjaan Persiapan">Pekerjaan Persiapan</option>
                <option value="Pekerjaan Tanah">Pekerjaan Tanah</option>
                <option value="Pekerjaan Pondasi">Pekerjaan Pondasi</option>
                <option value="Pekerjaan Beton">Pekerjaan Beton</option>
                <option value="Pekerjaan Finishing/Arsitektur">Pekerjaan Finishing/Arsitektur</option>
              </select>
            </div>
            <div class="col-md-7">
              <input type="text" id="searchAhs" class="form-control form-control-sm" placeholder="Cari nama pekerjaan atau kode AHS..." onkeyup="renderAhsLibrary()">
            </div>
          </div>

          <!-- Kontainer Daftar AHS -->
          <div id="ahsLibraryContainer">
            <!-- Render dinamis dari master-data.js dengan input koefisien -->
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Tutup</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Skrip Master Data & Aplikasi -->
  <script src="js/master-data.js"></script>
  <script>
    // Inisialisasi awal saat halaman dimuat
    document.addEventListener("DOMContentLoaded", function() {
      if (typeof renderPriceTable === 'function') {
        renderPriceTable('bahan');
        renderPriceTable('alat');
        renderPriceTable('upah');
      }
      if (typeof renderAhsLibrary === 'function') {
        renderAhsLibrary();
      }
    });
  </script>
</body>
</html>
