<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SiCerMat - Estimasi RAB</title>

  <!-- PWA Metadata & Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    body { background-color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card { border-radius: 16px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 15px; }
    .btn-custom { font-weight: 600; padding: 10px; border-radius: 8px; }
    .logo-container { padding: 20px 0; text-align: center; }
  </style>
</head>
<body>

  <!-- Logo Header -->
  <div class="logo-container">
    <img src="./icon.png" alt="SiCerMat Logo" width="120">
  </div>

  <div class="container pb-5">
    
    <!-- Card 1: Proyek Tersimpan -->
    <div class="card p-3">
      <h6 class="fw-bold mb-2">📁 Proyek Tersimpan</h6>
      <select class="form-select mb-3">
        <option selected>Pilih proyek...</option>
      </select>
      <div class="d-grid gap-2">
        <button class="btn btn-primary btn-custom">➕ Proyek Baru</button>
        <button class="btn btn-secondary btn-custom">✏️ Ganti Nama</button>
        <button class="btn btn-outline-danger btn-custom">🗑️ Hapus Proyek</button>
      </div>
    </div>

    <!-- Card 2: Form Detail Proyek -->
    <div class="card p-3">
      <div class="mb-3">
        <label class="form-label fw-bold small">📝 Nama Proyek</label>
        <input type="text" class="form-control" placeholder="Masukkan nama proyek...">
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold small">🏷️ Jenis Proyek</label>
        <select class="form-select">
          <option>Konstruksi</option>
          <option>Renovasi</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold small">📅 Tanggal</label>
        <input type="date" class="form-control">
      </div>
      <button class="btn btn-warning w-100 fw-bold">💾 Simpan Proyek</button>
    </div>

    <!-- Card 3: Action Buttons -->
    <div class="row g-2">
      <div class="col-4">
        <button class="btn btn-primary w-100 h-100 py-3 d-flex flex-column align-items-center justify-content-center" style="font-size: 0.75rem;">
          📚 <br> Buka Library
        </button>
      </div>
      <div class="col-4">
        <button class="btn btn-light border w-100 h-100 py-3 d-flex flex-column align-items-center justify-content-center" style="font-size: 0.75rem;">
          ➕ <br> Tambah Item
        </button>
      </div>
      <div class="col-4">
        <button class="btn btn-success w-100 h-100 py-3 d-flex flex-column align-items-center justify-content-center" style="font-size: 0.75rem;">
          📊 <br> Export
        </button>
      </div>
    </div>

  </div>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Register PWA Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker OK'))
          .catch(err => console.log('Service Worker Error', err));
      });
    }
  </script>
</body>
</html>
